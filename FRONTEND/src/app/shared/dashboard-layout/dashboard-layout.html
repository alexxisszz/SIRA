<nav class="navbar navbar-light bg-light border-bottom px-4">
  <span class="navbar-brand mb-0 h1">Refuerzo Académico</span>

  @if (rol() === Rol.Docente) {
    <div class="d-flex gap-3 mx-4">
      <a routerLink="/docente/alumnos" class="link-secondary text-decoration-none">Alumnos</a>
      <a routerLink="/docente/estadisticas" class="link-secondary text-decoration-none">Estadísticas</a>
    </div>
  }

  @if (rol() === Rol.Administrador) {
    <div class="d-flex gap-3 mx-4">
      <a routerLink="/admin/alumnos" class="link-secondary text-decoration-none">Alumnos</a>
      <a routerLink="/admin/docentes" class="link-secondary text-decoration-none">Docentes</a>
      <a routerLink="/admin/temas" class="link-secondary text-decoration-none">Temas</a>
      <a routerLink="/admin/reglas" class="link-secondary text-decoration-none">Reglas</a>
    </div>
  }

  <button type="button" class="btn btn-outline-secondary btn-sm ms-auto" (click)="cerrarSesion()">
    Cerrar sesión
  </button>
</nav>
