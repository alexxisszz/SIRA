<h1 class="h4 mb-1">Matemáticas</h1>
<p class="text-muted mb-4">Selecciona el tema que quieres evaluar</p>

@if (cargando()) {
  <p class="text-muted">Cargando temas...</p>
} @else if (error()) {
  <div class="alert alert-danger">No se pudieron cargar los temas.</div>
} @else {
  <div class="list-group">
    @for (tema of temas(); track tema.id) {
      <button
        type="button"
        class="list-group-item list-group-item-action"
        (click)="seleccionarTema(tema.id)"
      >
        {{ tema.nombre }}
      </button>
    }
  </div>
}
