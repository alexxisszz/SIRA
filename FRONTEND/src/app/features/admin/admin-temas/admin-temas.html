<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h4 mb-0">Temas</h1>
  <button type="button" class="btn btn-primary btn-sm" (click)="abrirCrear()">+ Nuevo tema</button>
</div>

@if (mostrarFormulario()) {
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h6 mb-3">{{ editando() ? 'Editar tema' : 'Nuevo tema' }}</h2>
      <form [formGroup]="formulario" (ngSubmit)="guardar()">
        <div class="row g-2">
          <div class="col-8">
            <label class="form-label small">Nombre</label>
            <input type="text" class="form-control" formControlName="nombre" />
          </div>
          <div class="col-4">
            <label class="form-label small">Orden</label>
            <input type="number" class="form-control" formControlName="orden" />
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary btn-sm" [disabled]="formulario.invalid">Guardar</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
}

@if (cargando()) {
  <p class="text-muted">Cargando temas...</p>
} @else {
  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>Orden</th>
        <th>Nombre</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (tema of temas(); track tema.id) {
        <tr>
          <td>{{ tema.orden }}</td>
          <td>{{ tema.nombre }}</td>
          <td class="text-end">
            <button type="button" class="btn btn-outline-secondary btn-sm me-2" (click)="abrirEditar(tema)">
              Editar
            </button>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="verPreguntas(tema)">
              Preguntas →
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
